<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bloxi" />
  <meta name="theme-color" content="#bfe6ff" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>Bloxi</title>
  <style>
    html, body { margin: 0; height: 100%; background: linear-gradient(180deg, #bfe6ff 0%, #ffe3f1 100%); }
    #splash {
      position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(180deg, #a9dcff 0%, #ffe0f0 100%); transition: opacity .4s ease, transform .4s ease;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    }
    #splash.hide { opacity: 0; transform: scale(1.06); pointer-events: none; }
    #splash img { width: 120px; height: 120px; border-radius: 30px; box-shadow: 0 10px 0 rgba(51,38,77,.12); animation: sb 1s ease-in-out infinite; }
    #splash div { font-size: 64px; font-weight: 900; color: #fff; -webkit-text-stroke: 10px #33264d; paint-order: stroke fill; letter-spacing: -1px; text-shadow: 0 7px 0 #33264d; }
    @keyframes sb { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/icon-192.png" alt="" /><div>BLOXI</div></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
